# TEMPORARY BRIDGE — not Task 19's smoke.yml. Deleted once Task 19 lands for real.
#
# Task 14 (matlab/qmrlab_ci_era3.m + helpers) is done and locally verified across 8
# models. Task 19 (the real smoke.yml, one target per lane) is blocked on Task 17
# (the Rust/qmrust adapter), which does not exist yet. This exists only to prove the
# MATLAB lane runs for real in Actions today, on a fast, closed-form, non-iterative
# model (b1_dam: two SPGR images, one arccos, no optimizer) rather than waiting for
# the full pipeline. workflow_dispatch only, so it never competes with real triggers.
name: matlab smoke (temporary preview)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fit-one-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .

      - name: Fetch and verify the canonical inputs
        run: python -m scripts.fetch_data --out osf-data

      - name: Clone qMRLab v3.0.0
        run: git clone --depth 1 --branch v3.0.0 https://github.com/qMRLab/qMRLab.git qMRLab

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: >
            Image_Processing_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath('qMRLab')); addpath('matlab');
            qmrlab_ci_era3('osf-data', 'results/qmrlab@v3.0.0', 'qmrlab@v3.0.0', 'v3.0.0', 'R2026a', {'b1_dam'}, '{"default":1}')

      - name: Show the record this run produced
        run: cat results/qmrlab@v3.0.0/records/b1_dam.json

      - name: Validate the record against the real schema
        run: |
          python - <<'PY'
          from harness.record import load_adapter_record
          rec = load_adapter_record("results/qmrlab@v3.0.0/records/b1_dam.json")
          print(f"status={rec.status} maps={[m['name'] for m in rec.maps]} repeats={rec.timing.get('repeats')}")
          assert rec.status == "ok", f"expected ok, got {rec.status}: {rec.error}"
          PY

      - name: Compare against the archive's own FitResults
        run: |
          python - <<'PY'
          from harness.compare import compare_maps
          from harness.nifti import read_nifti
          ours = read_nifti("results/qmrlab@v3.0.0/maps/b1_dam/B1map.nii.gz").values
          ref = read_nifti("osf-data/b1_dam/FitResults/B1map.nii.gz").values
          mask = read_nifti("masks/b1_dam.nii.gz").values
          r = compare_maps(ours, ref, mask, rel_tol=0.001)
          print(r)
          assert r["frac_within"] > 0.99 and r["pearson_r"] > 0.999, r
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: b1_dam-smoke-result
          path: results/qmrlab@v3.0.0/
