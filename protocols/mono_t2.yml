# Acquisition parameters for the `mono_t2` archive (spec 6.1). Values are qmrust's
# recipes/non-bids/mono_t2_config.yaml, cross-checked against the archive's own Protocol
# struct. Fit options (exponential vs linear, drop-first-echo, offset term) are
# deliberately absent: that is per-version drift, which is what the benchmark measures.
#
# Times are SECONDS everywhere in protocols/, never milliseconds. The archive records
# these in milliseconds and says so in its Format string.
dataset: mono_t2

parameters:
  # archive Protocol.SEdata, Format 'EchoTime (ms)' = 12.8 .. 384.0 in steps of 12.8 --
  # identical to these values. Thirty spin echoes, in the order of SEdata's 4th dimension.
  echo_time:
    unit: s
    values:
      - 0.0128
      - 0.0256
      - 0.0384
      - 0.0512
      - 0.0640
      - 0.0768
      - 0.0896
      - 0.1024
      - 0.1152
      - 0.1280
      - 0.1408
      - 0.1536
      - 0.1664
      - 0.1792
      - 0.1920
      - 0.2048
      - 0.2176
      - 0.2304
      - 0.2432
      - 0.2560
      - 0.2688
      - 0.2816
      - 0.2944
      - 0.3072
      - 0.3200
      - 0.3328
      - 0.3456
      - 0.3584
      - 0.3712
      - 0.3840

# No repetition_time. QUIT's MultiEcho parser asks for one and this archive does not have
# it -- not in the Protocol struct, not in qmrust's recipe, nowhere (spec 11). A plausible
# TR invented here would be indistinguishable from a measured one to every later reader,
# so the field is absent and its absence is stated. Whoever adds a QUIT mono_t2 adapter
# has to source a real value or declare the model incomparable.
