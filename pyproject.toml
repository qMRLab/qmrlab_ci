[project]
name = "qmrlab-ci-harness"
version = "0.1.0"
description = "Cross-version, cross-implementation qMRI benchmark harness"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scipy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
